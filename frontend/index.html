<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hamburgueria — Cardápio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🍔 Hamburgueria</h1>
    <a href="/carrinho.html" class="cart-link" id="link-carrinho" aria-label="Ver carrinho">
      🛒 <span id="carrinho-contador" class="cart-badge" hidden>0</span>
    </a>
    <button class="hamb-btn" id="btn-menu" aria-label="Abrir menu" aria-expanded="false">☰</button>
    <nav class="hamb-menu" id="menu-nav" hidden>
      <a href="/" class="active">Cardápio</a>
      <a href="/carrinho.html">Carrinho</a>
      <a href="/login.html">Área do Funcionário</a>
    </nav>
  </header>

  <div id="toast" class="toast" hidden></div>
  <div id="aviso" class="aviso" hidden></div>

  <section id="secao-ofertas" hidden>
    <h2>Ofertas do dia</h2>
    <div id="carrossel-ofertas" class="carrossel">
      <button type="button" class="carrossel-seta carrossel-anterior" aria-label="Oferta anterior">‹</button>
      <div class="carrossel-trilha" id="carrossel-trilha"></div>
      <button type="button" class="carrossel-seta carrossel-proxima" aria-label="Próxima oferta">›</button>
      <div class="carrossel-dots" id="carrossel-dots"></div>
    </div>
  </section>

  <main>
    <section id="secao-cardapio">
      <h2>Cardápio</h2>
      <div id="categoria-tabs" class="categoria-tabs"></div>
      <div id="cardapio" class="cards"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
